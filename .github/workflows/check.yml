name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: manager-service/go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.17.1'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Full checks and Linux race detection
        if: runner.os == 'Linux'
        run: python -B scripts/check.py --race
      - name: Full Windows checks
        if: runner.os == 'Windows'
        run: python -B scripts/check.py

  staticcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOBIN: ${{ runner.temp }}/go-tools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.17.1'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned analyzer outside the repository
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - name: Go checks and static analysis
        run: python -B scripts/check.py --scope go --staticcheck "$GOBIN/staticcheck"
